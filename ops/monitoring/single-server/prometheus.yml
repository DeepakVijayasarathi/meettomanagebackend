global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: single-server
    static_configs:
      - targets: [mtm-node-exporter:9100]
  - job_name: jitsi-video-bridge
    metrics_path: /metrics
    static_configs:
      - targets: [docker-jitsi-meet-jvb-1:8080]
        labels:
          instance: mtm-node-exporter:9100
